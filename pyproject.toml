[project]
name = "pdediff"
version = "0.0.1"
description = "Add your description here"
requires-python = ">=3.9"
dependencies = [
    "h5py",
    "jupyter",
    "numpy",
    "torch",
    "dawgz",
    "jax",
    "jaxlib",
    "matplotlib",
    "POT",
    "pandas",
    "seaborn",
    "tqdm",
    "zuko",
    "hydra-core",
    "hydra-colorlog",
    "hydra-joblib-launcher",
    "hydra-submitit-launcher",
    "fsspec",
    "wandb",
    "einops",
    "gdown",
    "scikit-learn>=1.6.1",
    "zarr>=2.18.2",
    "polars>=1.36.1",
    "pyarrow>=21.0.0",
    "jax-cfd>=0.2.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
