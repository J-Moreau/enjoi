# @package _global_

name: ARZ_joint_SDA

defaults:
  - /data: arz
  - /net: unet
  - /score: unet
  - /sampler: dpm

window: 12
amortized: false

net:
  hidden_channels: [64,128,256,1024]
  hidden_blocks: [3,3,3,3]
  kernel_size: 3
  activation: 'SiLU'
  spatial: ${data.spatial}
  padding_mode: 'zeros'

optim:
  lr: 2e-4
  weight_decay: 1e-3

eval:
  load_model_name: "score_last.pth"
  init_noise: False
  conditioning: true
  task: forecast
  forecast:
    conditioned_frame: 6
    trajectory_length: 360

# training:
epochs: 1024
batch_size: 1024
scheduler_name: 'linear'
model_type: "noise"
ema_decay: 0.9999
log_loss_per_level: True
