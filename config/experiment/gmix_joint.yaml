# @package _global_

name: gmix_joint

defaults:
  - /data: gmix
  - /net: unet
  - /score: unet
  - /sampler: dpm

window: 2
amortized: false
noise_std: 0.0
noise_std_da: 0.0

net:
  hidden_channels: [16]
  hidden_blocks: [1]
  kernel_size: 3
  activation: 'SiLU'
  spatial: ${data.spatial}
  padding_mode: 'circular'

optim:
  lr: 2e-4
  weight_decay: 1e-3

epochs: 1024
batch_size: 128
scheduler_name: 'linear'
model_type: "noise"
ema_decay: 0.9999
log_loss_per_level: false
